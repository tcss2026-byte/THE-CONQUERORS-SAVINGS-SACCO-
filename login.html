<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Account Access</title>

<link rel="stylesheet" href="style.css">

<style>
 

.menu-btn{
width:90%;
margin:15px auto;
display:block;
padding:25px;
font-size:20px;
border:none;
border-radius:50px;
color:white;
background:linear-gradient(to right,#00d26a,#63e600);
}

.form-box{
display:none;
background:white;
padding:20px;
margin:15px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,.15);
}

.form-box h2{
text-align:center;
margin-bottom:15px;
}

input{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ccc;
border-radius:8px;
}

.submit-btn{
width:100%;
padding:12px;
background:green;
color:white;
border:none;
border-radius:8px;
}

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    overflow-x:hidden;
}

.container{
    width:100%;
}

</style>

</head>

<body>

<header>

<img src="log.jpg">

<div class="header-text">

<h1>
THE CONQUERORS SAVINGS SACCO
</h1>

<h3>
SAVE TOGETHER, GROW TOGETHER
</h3>

</div>

</header>
<div class="container">

<h2 style="text-align:center;">
Account Access
</h2>
<button onclick="location.href='user-login.html'">
USER LOGIN
</button>

<button onclick="location.href='admin-login.html'">
ADMIN LOGIN
</button>

<button onclick="location.href='create-account.html'">
CREATE ACCOUNT
</button>

<a href="index.html"
class="menu-btn"
style="text-decoration:none;text-align:center;">
Back
</a>

<!-- USER LOGIN -->

<div id="userLogin" class="form-box">

<h2>User Login</h2>

<input
type="text"
id="username"
placeholder="Username">

<input
type="password"
id="password"
placeholder="Password">

<button
class="submit-btn"
onclick="memberLogin()">
Login
</button>

</div>

<!-- CREATE ACCOUNT -->

<div id="createAccount" class="form-box">

<h2>Create Account</h2>

<input
type="text"
id="firstName"
placeholder="First Name">

<input
type="text"
id="secondName"
placeholder="Second Name">

<input
type="text"
id="phone"
placeholder="Phone Number">

<input
type="text"
id="newUsername"
placeholder="Username">

<input
type="password"
id="newPassword"
placeholder="Password">

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password">

<button
class="submit-btn"
onclick="createAccount()">
Create Account
</button>

</div>

<!-- ADMIN LOGIN -->

<div id="adminLogin" class="form-box">

<h2>Admin Login</h2>

<input
type="text"
id="adminUsername"
placeholder="Admin Username">

<input
type="password"
id="adminPassword"
placeholder="Admin Password">

<button
class="submit-btn"
onclick="adminLogin()">
Admin Login
</button>

</div>
</div>
<!-- ✅ FIXED CLOCK SECTION -->
<div id="liveClockCard">
  <div id="liveClock"></div>
  <hr>
  <div id="todayHistory">
    Loading today's historical event...
  </div>
</div>
</div>
</div>

<a href="help.html" class="help-btn">
❓
</a>

<footer>

All Rights Reserved @ The Conquerors Savings Sacco

<br>

tcss2026@gmail.com

</footer>
<script type="module" src="script.js"></script>
<script>

function showSection(id){

document.getElementById(
"userLogin"
).style.display = "none";

document.getElementById(
"createAccount"
).style.display = "none";

document.getElementById(
"adminLogin"
).style.display = "none";

document.getElementById(
id
).style.display = "block";

}

</script>

</body>
</html>
