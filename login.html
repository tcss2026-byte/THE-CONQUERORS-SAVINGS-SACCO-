<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Account Access</title>

<link rel="stylesheet" href="style.css">

<style>
    header{
    background:green;
    color:white;
    padding:10px;
    display:flex;
    align-items:center;
    gap:10px;
    overflow:hidden;
}

header img{
    width:60px;
    height:60px;
    border-radius:50%;
    object-fit:cover;
    flex-shrink:0;
}

header h1{
    margin:0;
    font-size:22px;
    line-height:1.2;
}

header h3{
    margin:0;
    font-size:12px;
    opacity:.9;
}

.menu-btn{
width:90%;
margin:15px auto;
display:block;
padding:25px;
font-size:20px;
border:none;
border-radius:50px;
color:white;
background:linear-gradient(to right,#00d26a,#63e600);
}

.form-box{
display:none;
background:white;
padding:20px;
margin:15px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,.15);
}

.form-box h2{
text-align:center;
margin-bottom:15px;
}

input{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ccc;
border-radius:8px;
}

.submit-btn{
width:100%;
padding:12px;
background:green;
color:white;
border:none;
border-radius:8px;
}

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    overflow-x:hidden;
}

.container{
    width:100%;
}

</style>

</head>

<body>

<header style="
background:#ffffff;
padding:15px 10px;
display:flex;
align-items:center;
gap:15px;
border-bottom:6px solid #008000;
box-shadow:0 2px 5px rgba(0,0,0,0.15);
">

    <img src="log.jpg" alt="Logo" style="
    width:90px;
    height:90px;
    border-radius:50%;
    border:4px solid #008000;
    object-fit:cover;
    ">

    <div style="flex:1;">
        <h1 style="
        margin:0;
        color:#008000;
        font-size:24px;
        font-weight:900;
        line-height:1.1;
        text-transform:uppercase;
        font-family:Arial,sans-serif;
        ">
            THE CONQUERORS<br>
            SAVINGS SACCO
        </h1>

        <p style="
        margin:10px 0 0;
        color:#555;
        font-size:14px;
        font-weight:700;
        text-transform:uppercase;
        font-family:Arial,sans-serif;
        ">
            SAVE TOGETHER, GROW TOGETHER
        </p>
    </div>

</header>

<div class="container">

<h2 style="text-align:center;">
Account Access
</h2>
<button onclick="location.href='user-login.html'">
USER LOGIN
</button>

<button onclick="location.href='admin-login.html'">
ADMIN LOGIN
</button>

<button onclick="location.href='create-account.html'">
CREATE ACCOUNT
</button>

<a href="index.html"
class="menu-btn"
style="text-decoration:none;text-align:center;">
Back
</a>

<!-- USER LOGIN -->

<div id="userLogin" class="form-box">

<h2>User Login</h2>

<input
type="text"
id="username"
placeholder="Username">

<input
type="password"
id="password"
placeholder="Password">

<button
class="submit-btn"
onclick="memberLogin()">
Login
</button>

</div>

<!-- CREATE ACCOUNT -->

<div id="createAccount" class="form-box">

<h2>Create Account</h2>

<input
type="text"
id="firstName"
placeholder="First Name">

<input
type="text"
id="secondName"
placeholder="Second Name">

<input
type="text"
id="phone"
placeholder="Phone Number">

<input
type="text"
id="newUsername"
placeholder="Username">

<input
type="password"
id="newPassword"
placeholder="Password">

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password">

<button
class="submit-btn"
onclick="createAccount()">
Create Account
</button>

</div>

<!-- ADMIN LOGIN -->

<div id="adminLogin" class="form-box">

<h2>Admin Login</h2>

<input
type="text"
id="adminUsername"
placeholder="Admin Username">

<input
type="password"
id="adminPassword"
placeholder="Admin Password">

<button
class="submit-btn"
onclick="adminLogin()">
Admin Login
</button>

</div>

</div>

<a href="help.html" class="help-btn">
❓
</a>

<footer>

All Rights Reserved @ The Conquerors Savings Sacco

<br>

tcss2026@gmail.com

</footer>
<script type="module" src="script.js"></script>
<script>

function showSection(id){

document.getElementById(
"userLogin"
).style.display = "none";

document.getElementById(
"createAccount"
).style.display = "none";

document.getElementById(
"adminLogin"
).style.display = "none";

document.getElementById(
id
).style.display = "block";

}

</script>

</body>
</html>
