<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<img src="log.jpg">

<div class="header-text">

<h1>
THE CONQUERORS SAVINGS SACCO
</h1>

<h3>
SAVE TOGETHER, GROW TOGETHER
</h3>

</div>

</header>
<div class="container">

<h2>Reset Password</h2>

<input
type="text"
id="firstName"
placeholder="First Name">

<input
type="text"
id="secondName"
placeholder="Second Name">

<input
type="text"
id="username"
placeholder="Username">

<input
type="password"
id="newPassword"
placeholder="New Password">

<button
type="button"
id="toggleBtn"
onclick="togglePassword()">
SHOW PASSWORD
</button>

<br><br>

<button onclick="resetPassword()">
RESET PASSWORD
</button>

<br><br>

<a href="user-login.html">
BACK TO LOGIN
</a>

</div>

<div class="info-card">

<div id="liveClock"></div>

<hr>

<div id="todayHistory">
Loading today's historical event...
</div>

</div>
<a href="help.html" class="help-btn">
❓
</a>
<footer>

All Rights Reserved @
The Conquerors Savings Sacco

<br>

tcss2026@gmail.com

</footer>
<script type="module" src="script.js"></script>
<script>

function resetPassword(){

    let firstName =
    document.getElementById(
    "firstName"
    ).value.trim();

    let secondName =
    document.getElementById(
    "secondName"
    ).value.trim();

    let username =
    document.getElementById(
    "username"
    ).value.trim();

    let newPassword =
    document.getElementById(
    "newPassword"
    ).value;

    if(
    firstName === "" ||
    secondName === "" ||
    username === "" ||
    newPassword === ""
    ){

        alert(
        "Please fill all fields"
        );

        return;

    }

    let users =
    JSON.parse(
    localStorage.getItem(
    "users"
    )
    ) || [];

    let user =
    users.find(u =>

        u.firstName.toLowerCase() ===
        firstName.toLowerCase()

        &&

        u.secondName.toLowerCase() ===
        secondName.toLowerCase()

        &&

        u.username.toLowerCase() ===
        username.toLowerCase()

    );

    if(!user){

        alert(
        "User details not found"
        );

        return;

    }

    user.password =
    newPassword;

    localStorage.setItem(
    "users",
    JSON.stringify(users)
    );

    alert(
    "Password Reset Successfully"
    );

    setTimeout(function(){

        window.location.href =
        "user-login.html";

    },1000);

}

function togglePassword(){

    let passwordField =
    document.getElementById(
    "newPassword"
    );

    let button =
    document.getElementById(
    "toggleBtn"
    );

    if(
    passwordField.type ===
    "password"
    ){

        passwordField.type =
        "text";

        button.innerHTML =
        "HIDE PASSWORD";

    }else{

        passwordField.type =
        "password";

        button.innerHTML =
        "SHOW PASSWORD";

    }

}

</script>

</body>
</html>
